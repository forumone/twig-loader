name: CI

# No `paths:` filter: required checks must always report a status, or PRs
# that don't touch matching paths would wait forever on a skipped check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-pass:
    name: tests-pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Mocha tests, then eslint (no `posttest` script in this repo).
      - name: Run Tests
        run: npm test && npm run eslint

  version-bumped:
    name: version-bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require package version change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          head_version=$(node -p "require('./package.json').version")
          base_version=$(node -p "JSON.parse(process.argv[1]).version" "$(git show "$BASE_SHA:package.json")")
          if [[ "$head_version" == "$base_version" ]]; then
            echo "package.json version is unchanged ($head_version). Bump the version." >&2
            exit 1
          fi
          echo "✔ version: $base_version -> $head_version"
